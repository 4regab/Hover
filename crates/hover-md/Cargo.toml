[package]
name = "hover-md"
description = "The office's md.js, ported: safe Markdown to the same HTML, and to blocks for native layout."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# No doc tests here: rustdoc built and ran an empty set on every test run.
doctest = false

[dependencies]
fancy-regex.workspace = true
hover-diagram = { path = "../hover-diagram" }

[dev-dependencies]
serde_json = "1"
