[package]
name = "hover-agents"
description = "The agents (Services/AcpHost.cs, OpenCodeHost.cs, KiroRunner.cs, Agents.cs, Owl/KiroSession.cs, KiroPage's state): ACP over stdio, OpenCode's local server over HTTP, the sessions, and the office's state message. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hover-core = { path = "../hover-core" }
# In the tree (hover-md): KiroText's patterns look behind, which regex can't.
fancy-regex = { workspace = true }
# In the tree (hover-core): OpenCode's server password and its message ids.
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
# Already in the tree: kill(2) on the tool's process group, and PR_SET_PDEATHSIG.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
