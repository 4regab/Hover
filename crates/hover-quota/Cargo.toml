[package]
name = "hover-quota"
description = "The quota readers (Core/Quota.cs) and OwlApp's five-minute refresh: Claude Code, Kiro CLI, Codex and Cursor usage, read-only."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# No doc tests here: rustdoc built and ran an empty set on every test run.
doctest = false

[dependencies]
hover-core = { path = "../hover-core" }
hover-agents = { path = "../hover-agents" }
# Already in the tree (fancy-regex brings it): the kiro-cli report is read with the C#'s
# own patterns, and .NET's \d, \s and \b are Unicode, as regex's are by default.
regex = "1"
# Already in the tree: local time for "as of 26 Sep 11:55" and the reset dates.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Cursor's token is in its SQLite database (state.vscdb), as Microsoft.Data.Sqlite read
# it. New crate: nothing in the tree reads SQLite. Only its C library is used, through
# the eight calls in sqlite.rs. Linux builds SQLite in (an AppImage can't count on a
# system libsqlite3); Windows calls the winsqlite3.dll that Windows 10 and 11 ship
# (raw-dylib), so nothing is compiled or linked for MSVC here.
[target.'cfg(not(windows))'.dependencies]
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
# cursor.com and api.anthropic.com, as the chat fetches images (app/src/net.rs): rustls here.
ureq = "3"

[target.'cfg(windows)'.dependencies]
# Through schannel and the system's certificate store, as HttpClient does.
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

