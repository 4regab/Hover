[package]
name = "hover-chat"
description = "The office chat thread, native: Markdown blocks laid out as page.html lays them out, with selection, copy, links, images and diagrams."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# No doc tests here: rustdoc built and ran an empty set on every test run.
doctest = false

[dependencies]
hover-md = { path = "../hover-md" }
parley = { version = "0.11", default-features = false, features = ["std", "system"] }
swash = "0.2.10"
# memmap-fonts: the system's font files are mapped, not read into memory, when their
# faces are listed and when a flowchart's text is drawn (memmap2 is in the tree already).
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde_json = "1"
# Already in the tree through parley; used directly for double-click words with the
# CJK/Thai dictionaries, which parley's own segmenter leaves out.
icu_segmenter = { version = "2.1.2", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
serde_json = "1"
parley = { version = "0.11", default-features = false, features = ["std", "system"] }
