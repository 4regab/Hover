[package]
name = "hover"
description = "Hover, native: the notch, the office, Settings, the tray and the shortcut (App.xaml.cs, Owl/*, Services/TrayIcon, Interop/*), on Windows, Linux and macOS."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hover_app"
path = "src/lib.rs"
# No doc tests here: rustdoc built and ran an empty set on every test run.
doctest = false

# hoverai, not hover: Discord's game list matches any path ending in hover/hover.exe
# (Hover: Revolt of Gamers), and the install folder is Programs\Hover.
[[bin]]
name = "hoverai"
path = "src/main.rs"

[dependencies]
hover-core = { path = "../crates/hover-core" }
hover-agents = { path = "../crates/hover-agents" }
hover-quota = { path = "../crates/hover-quota" }
hover-notch = { path = "../crates/hover-notch" }
# The office (its scene on wgpu) and the chat drawer's thread.
hover-office = { path = "../crates/hover-office" }
hover-chat = { path = "../crates/hover-chat" }
# main.js imageFor: which of an answer's images the chat may load.
hover-md = { path = "../crates/hover-md" }
serde_json = "1"
# One process, one renderer: femtovg on wgpu (DirectComposition on Windows, as
# notch-proto; Metal on macOS; Vulkan or GL on Linux), and the software renderer for headless shots.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-femtovg-wgpu", "unstable-wgpu-30", "renderer-software", "software-renderer-systemfonts", "accessibility", "unstable-winit-030"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }
# The office's music (office-beats.ogg), which the page played through <audio>.
# New crates: an Ogg Vorbis decoder in pure Rust, and the system's audio output
# (WASAPI on Windows, ALSA, which PipeWire and PulseAudio serve, on Linux, CoreAudio on macOS,
# which also records the microphone for voice).
lewton = "0.10"
cpal = "0.18"

# A code block's Copy in the chat puts its text on the clipboard, and a pasted picture
# (image-data) is attached to the task or the reply.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# In the tree (hover-office): the menu bar's usage rings on macOS are drawn with it (mac/bar.rs),
# as pixels the system shows; the drawing is the same code on every OS, so its tests run everywhere.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
# Already in the tree: Local speech (phonon.rs) unpacks its managed Python's .tar.gz.
flate2 = "1"
tar = "0.4"
# New crate (pure Rust): every file Local speech downloads is checked against its
# pinned SHA-256, and nothing in the tree hashes SHA-256 on Windows (ring is there on Linux and macOS only).
sha2 = "0.10"

[target.'cfg(not(windows))'.dependencies]
# In the tree (hover-quota): the chat's web images, fetched as WebView2 fetched them for
# 2.x's page. rustls here (Linux and macOS).
ureq = "3"
# Already in the tree (winit): the window behind winit's, X11's on Linux (the notch's
# override-redirect window) and AppKit's on macOS (its NSView, and so its NSWindow).
raw-window-handle = "0.6"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree (winit): the notch's X11 window (override-redirect, its input
# shape), the global shortcut (XGrabKey) and the screenshots of the real screen.
x11rb = { version = "0.13", features = ["shape", "randr", "xtest"] }
# Already in the tree: the tray (StatusNotifierItem), notifications, and the portal's
# global shortcut on Wayland. With its object server, which the tray needs.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# In the tree (zbus): the tray menu's node type is serialised as D-Bus asks.
serde = { version = "1", features = ["derive"] }

# macOS: AppKit from Rust, with no Swift and no C to build. All of these are in the tree
# already (winit, arboard and cpal use the 0.6 family), pinned to the versions the lock holds.
# objc2-web-kit is the one addition: the agent browser is a WKWebView (browser_host.rs).
[target.'cfg(target_os = "macos")'.dependencies]
# The runtime: messages to Objective-C objects, and the class the notch's window is given
# so it never takes the keyboard while it rests.
objc2 = "=0.6.4"
# NSWindow (level, Spaces, click-through), NSScreen (the notch's size), NSStatusItem (the
# usage rings and the menu), NSEvent (the pointer), NSOpenPanel, NSWorkspace. Only the
# classes used are switched on: the defaults are all of AppKit, which would add CloudKit,
# CoreData and more to the tree and to the build.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std", "bitflags", "block2", "NSAppearance", "NSApplication", "NSBitmapImageRep", "NSButton", "NSCell", "NSColor", "NSControl",
    "NSEvent", "NSFont", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSResponder", "NSRunningApplication",
    "NSSavePanel", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "NSWorkspace",
    "NSGraphics", "NSFontDescriptor", "objc2-core-foundation", "libc",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std", "block2", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSString", "NSURL",
    "NSURLRequest", "NSURLResponse", "NSUserNotification", "NSValue", "objc2-core-foundation",
] }
# WKWebView: Hover's agent browser, one per session (browser_host.rs). CGWindowList, the screen
# panel's capture (screen.rs), is called straight from CoreGraphics, with no binding crate.
objc2-web-kit = { version = "=0.3.2", default-features = false, features = [
    "std", "block2", "objc2-app-kit", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate",
    "WKNavigationResponse", "WKPreferences", "WKSnapshotConfiguration", "WKUIDelegate", "WKUserContentController", "WKUserScript",
    "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWindowFeatures", "objc2-core-foundation",
] }
# The callbacks AppKit and WebKit take are blocks.
block2 = "=0.6.2"
# In the tree (hover-office): waits on wgpu's futures when the shared Metal device is made.
futures-lite = "2"

[target.'cfg(windows)'.dependencies]
# In the tree (hover-quota): the chat's web images, through schannel and the system's
# certificate store, as WebView2 fetched them for 2.x's page.
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
# Rust's allocations, on Windows. The process heap kept what the office freed (tens of
# MB of small blocks) after the office was dropped; mimalloc gives freed pages back.
mimalloc = { version = "=0.1.52", default-features = false }
# Already in the tree (mimalloc): its mi_collect, called once the office is dropped.
libmimalloc-sys = { version = "=0.1.49", default-features = false, features = ["extended"] }
# In the tree (hover-office): waits on wgpu's futures when the shared GPU device is made.
futures-lite = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Threading",
    "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_Com",
    "Win32_UI_Controls_Dialogs", "Win32_UI_Shell_Common",
    # PrintWindow: the screen panel's capture of the agent's own windows (screen.rs).
    "Win32_Storage_Xps",
] }

[build-dependencies]
slint-build = "=1.18.1"
# New crate: compiles hover.rc (the exe's icon) with the SDK's rc.exe, or llvm-rc
# under cargo-xwin. Without it the exe, its shortcuts and the taskbar show a blank icon.
embed-resource = "=3.0.11"

[features]
# Heap counting for tools/hover-measure (bench.rs `heap`); never in a release you ship.
profiling = []
