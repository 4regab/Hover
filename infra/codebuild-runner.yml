AWSTemplateFormatVersion: '2010-09-09'
Description: Windows CodeBuild runner for Hover GitHub releases.

Parameters:
  GitHubConnectionArn:
    Type: String
    Description: Existing AWS CodeConnections connection to GitHub.

Resources:
  BuildLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/codebuild/hover-release
      RetentionInDays: 14

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/hover-release
      Policies:
        - PolicyName: hover-release-build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/hover-release:*
              - Effect: Allow
                Action:
                  - codeconnections:GetConnection
                  - codeconnections:GetConnectionToken
                  - codeconnections:UseConnection
                Resource: !Ref GitHubConnectionArn

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: hover-release
      Description: Runs the Hover installer release job from GitHub Actions.
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 120
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: GITHUB
        Location: https://github.com/4regab/Hover.git
        Auth:
          Type: CODECONNECTIONS
          Resource: !Ref GitHubConnectionArn
      Environment:
        Type: WINDOWS_SERVER_2022_CONTAINER
        Image: aws/codebuild/windows-base:2022-1.0
        ComputeType: BUILD_GENERAL1_MEDIUM
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogs
      Triggers:
        Webhook: true
        FilterGroups:
          - - Type: EVENT
              Pattern: WORKFLOW_JOB_QUEUED

Outputs:
  ProjectName:
    Value: !Ref BuildProject
