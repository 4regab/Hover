AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Hover's CI and releases on AWS CodeBuild: one batch project started by its own GitHub
  webhook (Windows and Linux tests in parallel, then the release), its two roles, its
  logs, a bucket for the build cache and the installers, and an optional 72 GB Windows
  fleet.

# Deploying it is in docs/development/architecture.md ("Deploying CI"). In short:
#   aws cloudformation deploy --stack-name hover-codebuild-runner \
#     --template-file infra/codebuild.yml --capabilities CAPABILITY_IAM \
#     --parameter-overrides GitHubConnectionArn=<the connection's ARN>

Parameters:
  GitHubConnectionArn:
    Type: String
    Description: Existing AWS CodeConnections connection to GitHub.
  GitHubTokenSecretName:
    Type: String
    Default: hover/github-release-token
    Description: >-
      Secrets Manager secret with a GitHub token (contents:write on the repo) as plain
      text, for publishing releases. ci/buildspec-release.yml reads it by this name, so
      change both together.
  WindowsFleet:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
    Description: >-
      Run the Windows build on a reserved fleet (36 vCPUs, 72 GB) instead of on-demand
      BUILD_GENERAL1_LARGE (8 vCPUs, 16 GB, the largest on-demand Windows size). A
      reserved fleet is billed for as long as its machines run, builds or not.
  WindowsFleetCapacity:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Machines the Windows fleet keeps running; builds past them wait for one.

Conditions:
  MakeWindowsFleet: !Equals [!Ref WindowsFleet, 'true']

Resources:
  # The build cache (cache/) and the installers the Windows and Linux builds hand to the
  # release build (installers/<batch>/). Both are only working copies, so they expire.
  CiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: installers
            Status: Enabled
            Prefix: installers/
            ExpirationInDays: 14
          # A cache key is saved once, so old keys would pile up. A build that finds
          # none just builds from scratch and saves a new one.
          - Id: cache
            Status: Enabled
            Prefix: cache/
            ExpirationInDays: 30
          - Id: unfinished-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  CiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CiBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt CiBucket.Arn
              - !Sub '${CiBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  BuildLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/codebuild/hover-ci
      RetentionInDays: 14

  # What every build of the batch runs as. A pull request's builds run as it too, which
  # is why pull requests from forks wait for a maintainer's approval (below).
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  - !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/hover-ci
                  - !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:build/hover-ci:*
                  - !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:build-batch/hover-ci:*
      Policies:
        - PolicyName: hover-ci-build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/hover-ci:*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${CiBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource: !GetAtt CiBucket.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                # Secrets Manager adds six random characters to the name in the ARN.
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GitHubTokenSecretName}-??????
              - Effect: Allow
                Action:
                  - codeconnections:GetConnection
                  - codeconnections:GetConnectionToken
                  - codeconnections:UseConnection
                Resource: !Ref GitHubConnectionArn
              # Each build looks itself up to find its batch, which names its folder
              # in installers/.
              - Effect: Allow
                Action: codebuild:BatchGetBuilds
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/hover-ci

  # What CodeBuild runs the batch as. Kept apart from BuildRole, as AWS advises: a build
  # that could start builds could get round the batch's limits.
  BatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  - !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/hover-ci
                  - !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:build-batch/hover-ci:*
      Policies:
        - PolicyName: hover-ci-batch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:StopBuild
                  - codebuild:RetryBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/hover-ci
                  - !If [MakeWindowsFleet, !Ref WindowsBuildFleet, !Ref AWS::NoValue]
              # The batch's final pass or fail goes to GitHub as this role. Without
              # it, the commit kept showing the "pending" the batch started with.
              - Effect: Allow
                Action:
                  - codeconnections:GetConnection
                  - codeconnections:GetConnectionToken
                  - codeconnections:UseConnection
                Resource: !Ref GitHubConnectionArn

  WindowsBuildFleet:
    Type: AWS::CodeBuild::Fleet
    Condition: MakeWindowsFleet
    Properties:
      Name: hover-windows-72gb
      EnvironmentType: WINDOWS_SERVER_2022_CONTAINER
      ComputeType: ATTRIBUTE_BASED_COMPUTE
      ComputeConfiguration:
        vCpu: 36
        memory: 72
        disk: 256
        machineType: GENERAL
      BaseCapacity: !Ref WindowsFleetCapacity
      # Builds past the fleet's machines wait for one rather than run on demand,
      # where Windows tops out at 8 vCPUs and 16 GB.
      OverflowBehavior: QUEUE

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: hover-ci
      Description: Hover's CI and releases, one batch build per GitHub event.
      # A public status picture for the README (its address is in the project's badge).
      BadgeEnabled: true
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 120
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: GITHUB
        Location: https://github.com/4regab/Hover.git
        GitCloneDepth: 1
        Auth:
          Type: CODECONNECTIONS
          Resource: !Ref GitHubConnectionArn
        # The commit and the pull request show the batch's pass or fail.
        ReportBuildStatus: true
        # The batch: the graph of the three builds. It lives here rather than in the
        # repo so the Windows machine follows WindowsFleet, and so a pull request can't
        # change the machines it runs on. Each build's own steps are in ci/.
        BuildSpec: !Sub
          - |
            version: 0.2
            batch:
              # A failure on one OS doesn't stop the other: both results are worth having.
              fast-fail: false
              build-graph:
                - identifier: windows
                  buildspec: ci/buildspec-windows.yml
                  env:
                    type: WINDOWS_SERVER_2022_CONTAINER
                    image: aws/codebuild/windows-base:2022-1.0
                    ${WindowsCompute}
                - identifier: linux
                  buildspec: ci/buildspec-linux.yml
                  env:
                    type: LINUX_CONTAINER
                    image: aws/codebuild/standard:7.0
                    compute-type: BUILD_GENERAL1_XLARGE
                # Runs only once both tests pass, so one build publishes, and only
                # what was tested.
                - identifier: release
                  buildspec: ci/buildspec-release.yml
                  depend-on:
                    - windows
                    - linux
                  env:
                    type: LINUX_CONTAINER
                    image: aws/codebuild/standard:7.0
                    compute-type: BUILD_GENERAL1_XLARGE
          - WindowsCompute: !If
              - MakeWindowsFleet
              - !Sub 'fleet: ${WindowsBuildFleet}'
              - 'compute-type: BUILD_GENERAL1_LARGE'
      # The defaults; each build of the batch sets its own machine. CodeBuild also
      # uses these for the batch's own step that reads the graph.
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_XLARGE
        EnvironmentVariables:
          - Name: HOVER_CI_BUCKET
            Type: PLAINTEXT
            Value: !Ref CiBucket
      Cache:
        Type: S3
        Location: !Sub '${CiBucket}/cache'
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogs
      BuildBatchConfig:
        ServiceRole: !GetAtt BatchRole.Arn
        # One status on the commit for the whole batch.
        BatchReportMode: REPORT_AGGREGATED_BATCH
        CombineArtifacts: false
        TimeoutInMins: 180
        Restrictions:
          MaximumBuildsAllowed: 3
      Triggers:
        Webhook: true
        BuildType: BUILD_BATCH
        # A pull request from a fork starts nothing until someone with write access
        # comments /codebuild_run(<commit>). Read its ci/ changes first: its builds run
        # with this project's role, which can read the release token.
        PullRequestBuildPolicy:
          RequiresCommentApproval: FORK_PULL_REQUESTS
        FilterGroups:
          # A push to rust-port/**, unless every file it changes is Markdown, under docs/
          # or one of the README's pictures. FILE_PATH starts a build when any changed
          # file matches, so the pattern matches the files that aren't those (RE2 has no
          # look-ahead to say "not"). ponytail: a root file of three letters or fewer
          # that starts with "a" or "d" doesn't count; spell it out if one ever appears.
          - - Type: EVENT
              Pattern: PUSH
            - Type: HEAD_REF
              Pattern: ^refs/heads/rust-port/.*
            - Type: FILE_PATH
              Pattern: '^([^da]|d([^o]|o([^c]|c([^s]|s[^/])))|a([^s]|s([^s]|s([^e]|e([^t]|t([^s]|s([^/]|/([^r]|r([^e]|e([^a]|a([^d]|d([^m]|m([^e]|e[^/]))))))))))))).*([^d]|[^m]d|[^.]md)$'
          # A pushed tag v*, whatever it changes.
          - - Type: EVENT
              Pattern: PUSH
            - Type: HEAD_REF
              Pattern: ^refs/tags/v.*
          - - Type: EVENT
              Pattern: PULL_REQUEST_CREATED, PULL_REQUEST_UPDATED, PULL_REQUEST_REOPENED

Outputs:
  ProjectName:
    Value: !Ref BuildProject
  BucketName:
    Value: !Ref CiBucket
  WindowsFleetName:
    Condition: MakeWindowsFleet
    Value: hover-windows-72gb
