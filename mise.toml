[tools]
go = "1.27.0"
node = "22"

# Optional task aliases. Platform prerequisites are documented separately; these tasks call
# the same build entry points developers already use.
[tasks.build-linux]
description = "Build the Linux app"
run = "make"

[tasks.build-windows]
description = "Build the Windows app"
run_windows = "pwsh -NoProfile -File ./build.ps1"

[tasks.build-macos]
description = "Build the macOS app"
run = "./scripts/build-macos.sh"

[tasks.office]
description = "Install web office dependencies and build its page"
run = ["npm ci --prefix web/office", "node web/office/build.mjs"]
