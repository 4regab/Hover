# TEMPORARY: runs the live notch test again and again, to make an intermittent failure happen on
# purpose and keep its log. Started by a push of its settings file only. Deleted in the last commit of the item that made it.
name: Notch repeat

# A workflow can only be started by hand when its file is on the default branch, which this work
# must not touch. So a push of .github/notch-repeat.cfg (lines "runs=25", "load=false", "test=...") starts it.
on:
  push:
    branches: [windows-csharp]
    paths: ['.github/notch-repeat.cfg']

# Its own group: it never cancels or waits for ci.yml.
concurrency:
  group: notch-repeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repeat:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Settings from .github/notch-repeat.cfg
        run: |
          $cfg = @{ runs = '25'; load = 'false'; test = 'Settings_open_in_the_open_notch' }
          foreach ($line in Get-Content .github/notch-repeat.cfg) {
            if ($line -match '^\s*(runs|load|test)\s*=\s*(\S+)\s*$') { $cfg[$Matches[1]] = $Matches[2] }
          }
          $cfg.GetEnumerator() | ForEach-Object { "REPEAT_$($_.Key.ToUpper())=$($_.Value)" } | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $cfg.GetEnumerator() | ForEach-Object { "$($_.Key) = $($_.Value)" }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the app
        run: ./build.ps1 publish
      - name: Build the test project
        run: dotnet build windows\Hover.Settings.Tests\Hover.Settings.Tests.csproj -c Release --nologo -v minimal
      - name: Screen 1920 x 1080
        run: ./tools/set-resolution.ps1
      - name: Load
        if: ${{ env.REPEAT_LOAD == 'true' }}
        run: |
          $n = [Environment]::ProcessorCount
          1..$n | ForEach-Object { Start-Process pwsh -ArgumentList '-NoProfile', '-Command', '$x = 0; while ($true) { $x++ }' -WindowStyle Hidden }
          "$n busy loops started"
      - name: Run the test
        run: |
          $env:HOVER_APP_EXE = (Resolve-Path publish\hoverai.exe).Path
          New-Item -ItemType Directory -Force out\repeat | Out-Null
          $runs = [int]$env:REPEAT_RUNS
          $filter = "FullyQualifiedName~$env:REPEAT_TEST"
          $passed = 0
          $failed = @()
          for ($i = 1; $i -le $runs; $i++) {
            $text = & dotnet test windows\Hover.Settings.Tests\Hover.Settings.Tests.csproj -c Release --no-build --filter $filter `
              --logger "trx;LogFileName=run-$i.trx" --logger "console;verbosity=detailed" --results-directory out\repeat 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) { $passed++ } else { $failed += $i; Set-Content -Path "out\repeat\failed-$i.txt" -Value $text }
            "run ${i}: exit code $LASTEXITCODE (passed so far $passed)"
          }
          $line = "runs $runs, passed $passed, failed $($failed.Count)$(if ($failed.Count) { ' (' + ($failed -join ', ') + ')' })"
          $line
          "### Notch repeat", '', $line, '', "load: $env:REPEAT_LOAD" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($failed.Count -gt 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notch-repeat
          path: out/repeat/
          if-no-files-found: warn
