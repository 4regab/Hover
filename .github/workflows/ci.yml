name: CI

# The native (Rust) Hover on GitHub's own runners: one job per platform runs the tests
# and the headless screenshots. On a v* tag (three numbers, matching native/Cargo.toml)
# the same jobs then build the installers from the build they just tested, and
# `release` publishes them together as a pre-release. No secrets and no agent
# accounts: agent runs use the repo's fake-agent.
on:
  push:
    branches: ['rust-port/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        if: env.RELEASE == 'true'
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw 'Release tag must be v followed by three numeric version parts, for example v3.1.0.'
          }
          $crate = (Select-String -Path native\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($crate -ne $Matches.version) { throw "The tag is $env:GITHUB_REF_NAME but native/Cargo.toml says $crate." }
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$($Matches.version)"
      # rust-toolchain.toml picks the version; rustup and MSVC are on the runner.
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Test
        run: cargo test --manifest-path native/Cargo.toml --release --workspace --no-fail-fast
      - name: Headless screenshots
        run: |
          cargo build --manifest-path native/Cargo.toml --release -p hover
          $env:HOVER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'hover-data'
          .\native\target\release\hoverai.exe --shots (Join-Path $env:RUNNER_TEMP 'shots') | Out-Host
          $n = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'shots') -Filter *.png).Count
          if ($n -eq 0) { throw 'no screenshots were written' }
          Write-Host "$n screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: shots-windows
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: error
      # build.ps1 finds Inno Setup 6 or 7; installed only when the image lacks it.
      - name: Build installer
        if: env.RELEASE == 'true'
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          .\build.ps1 installer -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: installer-windows
          path: dist/Hover-Setup-${{ env.RELEASE_VERSION }}.exe
          if-no-files-found: error

  linux:
    # Ubuntu 22.04 (glibc 2.35), so the packages run on 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        if: env.RELEASE == 'true'
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo 'Release tag must be v followed by three numeric version parts, for example v3.1.0.' >&2; exit 1; }
          echo "RELEASE_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - name: System libraries
        run: |
          sudo apt-get update
          # Build: fontconfig, FreeType, ALSA, xkbcommon. Tests: DejaVu (the chat goldens),
          # dbus, GNOME Keyring and Python's GLib (the D-Bus tests skip without them).
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig1-dev libfreetype-dev libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev fonts-dejavu-core \
            dbus gnome-keyring python3-gi mesa-vulkan-drivers
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Test
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
        run: |
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          cargo test --manifest-path native/Cargo.toml --release --workspace --no-fail-fast
      - name: Headless screenshots
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
          HOVER_DATA_DIR: ${{ runner.temp }}/hover-data
        run: |
          cargo build --manifest-path native/Cargo.toml --release -p hover
          ./native/target/release/hoverai --shots "$RUNNER_TEMP/shots"
          ls "$RUNNER_TEMP/shots"/*.png > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: shots-linux
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: error
      - name: Build packages
        if: env.RELEASE == 'true'
        run: make package VERSION="$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: installer-linux
          path: |
            dist/hover_${{ env.RELEASE_VERSION }}_amd64.deb
            dist/hover-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    # One job publishes, so the two builds never race to create the release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Hover ${{ github.ref_name }} (native, pre-release)
          # A pre-release is never "Latest": 2.x downloads stay where they are.
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
