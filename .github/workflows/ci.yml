name: CI

# Hover on GitHub's own runners. A push to main or go-port, or a pull request, checks the Go
# code for Windows, Linux and macOS; builds the Windows app and its installer and drives them
# (it starts the app, then installs over the 5.x release and uninstalls); builds the Linux
# packages; and builds the Mac app and runs its backend through the stand-in tools. No Go tests
# run here. A release: a v* tag (matching VERSION), or a push to main whose VERSION has no tag
# yet. The same jobs then make the installers, and `release` tags the commit and publishes
# them together as the Latest release, with the Mac app in disk images (signed ad hoc).
# A version whose CHANGELOG.md heading ends in "(nightly)" is published as a pre-release
# instead, and is not made the Latest.
# No secrets and no agent accounts. By hand (workflow_dispatch), `pictures` also draws every
# view on the Windows runner.
on:
  push:
    branches: ['main', 'go-port']
    # Docs-only pushes don't rebuild. (Path filters don't apply to tags.)
    paths-ignore: ['**.md', 'docs/**', 'assets/readme/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The Linux app draws through Gio's EGL (a C compiler and the EGL headers); its window
      # is Wayland, spoken directly, so Gio's own Wayland, X11 and Vulkan are left out.
      - run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev
      # The number in VERSION is the one the release uses; version.go's copy is for `go run`.
      - name: VERSION matches version.go
        run: |
          v=$(tr -d '\r' < VERSION | head -n 1)
          d=$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/shell/version.go)
          [ "$v" = "$d" ] || { echo "::error::VERSION is $v but internal/shell/version.go says $d"; exit 1; }
      - run: test -z "$(gofmt -l cmd internal third_party)" || { gofmt -l cmd internal third_party; exit 1; }
      - run: go vet -tags nowayland,nox11,novulkan ./cmd/... ./internal/...
      - run: GOOS=windows go vet ./cmd/... ./internal/...
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./cmd/... ./internal/...
      # The Mac backend compiles for both Macs.
      - run: GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/hover-backend && GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/hover-backend

  windows:
    runs-on: windows-2022
    outputs:
      release: ${{ steps.rel.outputs.release }}
      version: ${{ steps.rel.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # A release: a v* tag, or a push to main whose VERSION has no tag yet (so raising the
      # version is what releases it).
      - name: Release?
        id: rel
        run: |
          $ver = (Get-Content VERSION -TotalCount 1).Trim()
          $release = $false
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            if ($env:GITHUB_REF_NAME -ne "v$ver") { throw "The tag is $env:GITHUB_REF_NAME but VERSION says $ver." }
            $release = $true
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -eq 'main') {
            $tagged = git ls-remote --tags origin "refs/tags/v$ver"
            if ($LASTEXITCODE -ne 0) { throw "couldn't list the tags" }
            $release = -not $tagged
          }
          Write-Host "version $ver, release: $release"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE=$($release.ToString().ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release=$($release.ToString().ToLower())"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # hoverai.exe and wgpu_native.dll in publish\, as the installer takes them. No C compiler.
      - name: Build
        run: ./build.ps1 publish -Version $env:RELEASE_VERSION
      - name: Screen 1920 x 1080
        run: ./tools/set-resolution.ps1
      - name: Drive the app
        timeout-minutes: 5
        run: ./tools/app-smoke.ps1 -Exe publish\hoverai.exe -Out out\app
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
            $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }
          }
      - name: Build the setup
        run: ./build.ps1 installer -Version $env:RELEASE_VERSION
      # The latest 5.x release the Rust app shipped: what an update installs over.
      - name: The 5.x setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force old | Out-Null
          gh release download v5.0.2 --repo ${{ github.repository }} --pattern 'Hover-Setup-5.0.2.exe' --dir old
          if ($LASTEXITCODE -ne 0) { throw 'no 5.0.2 setup to install over' }
      - name: Install over 5.x, check, uninstall
        timeout-minutes: 10
        run: ./tools/installer-check.ps1 -Setup "dist\Hover-Setup-$env:RELEASE_VERSION.exe" -Old old\Hover-Setup-5.0.2.exe -Built publish\hoverai.exe -Out out\installer
      - name: Summary
        if: always()
        run: |
          foreach ($pair in @(@('out\app\report.json', 'Go app on Windows'), @('out\installer\report.json', 'Installer on Windows'))) {
            if (Test-Path $pair[0]) {
              $r = Get-Content $pair[0] -Raw | ConvertFrom-Json
              @('', "### $($pair[1])", '') + ($r.PSObject.Properties | Where-Object Name -ne 'log' | ForEach-Object { "    $($_.Name) = $($_.Value)" }) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-reports
          path: out/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/Hover-Setup-${{ env.RELEASE_VERSION }}.exe
          if-no-files-found: error

  linux:
    # Ubuntu 22.04 (glibc 2.35), so the packages run on 22.04 and newer.
    runs-on: ubuntu-22.04
    outputs:
      release: ${{ steps.rel.outputs.release }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The same choice as the Windows job's.
      - name: Release?
        id: rel
        run: |
          ver=$(tr -d '\r' < VERSION | head -n 1)
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$ver" ]] || { echo "The tag is $GITHUB_REF_NAME but VERSION says $ver." >&2; exit 1; }
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == main ]]; then
            [[ -z "$(git ls-remote --tags origin "refs/tags/v$ver")" ]] && release=true
          fi
          echo "version $ver, release: $release"
          { echo "RELEASE=$release"; echo "RELEASE_VERSION=$ver"; } >> "$GITHUB_ENV"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev
      # The packages are made and kept on every run (compiled, not run: no Wayland desktop on
      # the runner).
      - name: Build packages
        run: make package VERSION="$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: |
            dist/hover_${{ env.RELEASE_VERSION }}_amd64.deb
            dist/hover-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    # Apple Silicon runner. The runner has no display, Keychain or permission prompts to run
    # Hover on, so the Mac app is checked by running its packaged backend against stand-in
    # tools (tests/macos/backend-smoke.py). The Mac app is the Swift UI in macos/ with the web
    # office (web/office), on the Go backend (cmd/hover-backend). Every run makes Hover.app
    # (signed ad hoc); a release also makes it for Intel and puts both in disk images.
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      release: ${{ steps.rel.outputs.release }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The same choice as the Windows job's.
      - name: Release?
        id: rel
        run: |
          ver=$(tr -d '\r' < VERSION | head -n 1)
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$ver" ]] || { echo "The tag is $GITHUB_REF_NAME but VERSION says $ver." >&2; exit 1; }
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == main ]]; then
            [[ -z "$(git ls-remote --tags origin "refs/tags/v$ver")" ]] && release=true
          fi
          echo "version $ver, release: $release"
          { echo "RELEASE=$release"; echo "RELEASE_VERSION=$ver"; } >> "$GITHUB_ENV"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      # Voice uses macOS 26's SpeechAnalyzer, which needs the macOS 26 SDK: the newest
      # Xcode 26 on the image (its default is older). Without one the build goes on, and
      # Voice.swift compiles only the older recognizer (#if compiler(>=6.2)).
      - name: Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x/Contents/Developer"; fi
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/office/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # npm ci and the office page, the Swift app, the Go backend, the guardian,
      # Info.plist (the version from VERSION) and an ad hoc signature.
      - name: Hover.app
        run: |
          ./scripts/build-macos.sh
          file dist/macos-osx-arm64/Hover.app/Contents/Resources/backend/hover-backend
          codesign --verify --deep --strict dist/macos-osx-arm64/Hover.app
          ditto -c -k --keepParent dist/macos-osx-arm64/Hover.app dist/Hover-osx-arm64-development.zip
      - name: The packaged backend
        run: |
          S=$(mktemp -d /private/tmp/hover-sandbox.XXXXXX); mkdir -p "$S/fake-bin" "$S/tmp"
          export HOVER_SANDBOX_ROOT="$S" HOVER_SANDBOXED=1 TMPDIR="$S/tmp/" PATH="$S/fake-bin:/usr/bin:/bin"
          /usr/bin/python3 tests/macos/backend-smoke.py "$GITHUB_WORKSPACE/dist/macos-osx-arm64/Hover.app" "$S"
      - uses: actions/upload-artifact@v4
        with:
          name: Hover-macOS-development
          path: dist/Hover-osx-arm64-development.zip
          retention-days: 7
          if-no-files-found: error
      # A release (or a run started by hand, to try the packaging) builds Intel too: Go and
      # Swift cross-compile on the Apple Silicon runner.
      - name: Hover.app (Intel)
        if: env.RELEASE == 'true' || github.event_name == 'workflow_dispatch'
        env:
          HOVER_ARCH: x64
        run: ./scripts/build-macos.sh
      # A disk image per arch: Hover.app beside a link to /Applications, to drag across.
      # hdiutil on the runners is sometimes "busy" for a moment, so it is tried again.
      - name: Disk images
        if: env.RELEASE == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          for rid in arm64 x64; do
            stage=$(mktemp -d)
            ditto "dist/macos-osx-$rid/Hover.app" "$stage/Hover.app"
            ln -s /Applications "$stage/Applications"
            out="dist/Hover-$RELEASE_VERSION-macos-$rid.dmg"
            for try in 1 2 3 4 5; do
              hdiutil create -volname Hover -srcfolder "$stage" -ov -format UDZO "$out" && break
              [[ $try == 5 ]] && exit 1; sleep 5
            done
            hdiutil verify "$out"
          done
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: installer-macos
          path: |
            dist/Hover-${{ env.RELEASE_VERSION }}-macos-arm64.dmg
            dist/Hover-${{ env.RELEASE_VERSION }}-macos-x64.dmg
          if-no-files-found: error

  # Every view drawn on the Windows runner (WARP, no GPU), by hand only. Slow (about ten
  # minutes), and not a check: the pictures are for looking at.
  pictures:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Only for wgpu_native.dll, which the office draws with.
      - name: Build
        run: ./build.ps1 publish
      - name: Draw them
        run: |
          $env:CGO_ENABLED = '0'
          $env:HOVER_SHOTS_OFFICE = '1'
          $env:WGPU_NATIVE_PATH = (Resolve-Path publish\wgpu_native.dll).Path
          go run ./cmd/ui-shots out\all
          if ($LASTEXITCODE -ne 0) { throw 'ui-shots failed' }
          Write-Host "$((Get-ChildItem out\all -Filter *.png).Count) pictures"
      - uses: actions/upload-artifact@v4
        with:
          name: pictures-windows
          path: out/all/
          if-no-files-found: error

  release:
    # One job publishes, so the builds never race to create the release.
    if: needs.windows.outputs.release == 'true' && needs.linux.outputs.release == 'true' && needs.macos.outputs.release == 'true'
    needs: [check, windows, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      # The release text is this version's section of CHANGELOG.md, so the page on GitHub
      # says what the changelog says. A version with no section stops the release here.
      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          {
            echo "**macOS:** download \`Hover-$VERSION-macos-arm64.dmg\` (Apple silicon) or \`-macos-x64.dmg\` (Intel), open it and drag Hover to Applications. The app isn't notarized yet, so the first time, open it with right-click → Open (or System Settings → Privacy & Security → Open Anyway)."
            echo
            tr -d '\r' < CHANGELOG.md | awk -v v="$VERSION" 'on && /^## \[/ { exit } index($0, "## [" v "]") == 1 { on = 1; next } on { print }'
          } > release-notes.md
          if ! grep -q '^### ' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION. Add '## [$VERSION] - date' with its changes, then run the release again."
            exit 1
          fi
          cat release-notes.md
          # A nightly build: the version's heading ends in "(nightly)" (## [5.0.1] - date (nightly)).
          if tr -d '\r' < CHANGELOG.md | grep -F "## [$VERSION]" | head -n1 | grep -q '(nightly)$'; then
            echo "nightly=true" >> "$GITHUB_OUTPUT"
          else
            echo "nightly=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # The tag is made here when a push released (on a tag push it is that tag).
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Hover v${{ needs.windows.outputs.version }}${{ steps.notes.outputs.nightly == 'true' && ' (nightly)' || '' }}
          # Each release is the Latest one, unless it is a nightly: that is a pre-release and
          # leaves the Latest where it was.
          prerelease: ${{ steps.notes.outputs.nightly == 'true' }}
          make_latest: ${{ steps.notes.outputs.nightly == 'true' && 'false' || 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: release-notes.md
