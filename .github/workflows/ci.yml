name: CI

# The native (Rust) Hover on GitHub's own runners. A push to main or rust-port/**, or a
# pull request, runs the tests on Windows and Linux, and builds the Mac app on macOS (a
# compile check). A release:
# a v* tag (matching Cargo.toml), or a push to
# main whose Cargo.toml version has no tag yet. The same jobs then build the
# installers from what they just tested, and `release` tags the commit and publishes
# them together as the Latest release, with the Mac app in disk images (signed ad hoc).
# A version whose CHANGELOG.md heading ends in "(nightly)" is published as a pre-release
# instead, and is not made the Latest.
# No secrets and no agent accounts: agent runs use the repo's fake-agent.
on:
  push:
    branches: ['main', 'rust-port/**']
    # Docs-only pushes don't rebuild. (Path filters don't apply to tags.)
    paths-ignore: ['**.md', 'docs/**', 'assets/readme/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    runs-on: windows-2022
    outputs:
      release: ${{ steps.rel.outputs.release }}
      version: ${{ steps.rel.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # A release: a v* tag, or a push to main whose Cargo.toml version
      # has no tag yet (so raising the version is what releases it).
      - name: Release?
        id: rel
        run: |
          $crate = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $release = $false
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            if ($env:GITHUB_REF_NAME -ne "v$crate") { throw "The tag is $env:GITHUB_REF_NAME but Cargo.toml says $crate." }
            $release = $true
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -eq 'main') {
            $tagged = git ls-remote --tags origin "refs/tags/v$crate"
            if ($LASTEXITCODE -ne 0) { throw "couldn't list the tags" }
            $release = -not $tagged
          }
          Write-Host "version $crate, release: $release"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE=$($release.ToString().ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$crate"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release=$($release.ToString().ToLower())"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$crate"
      # Rust on Windows links with MSVC. Its build tools go in only if the image lacks them.
      - name: Visual Studio Build Tools
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if ((Test-Path $vswhere) -and (& $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)) {
            Write-Host 'MSVC build tools already installed'
            exit 0
          }
          $setup = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest 'https://aka.ms/vs/17/release/vs_buildtools.exe' -OutFile $setup
          $process = Start-Process $setup -ArgumentList '--quiet', '--wait', '--norestart', '--nocache',
            '--add', 'Microsoft.VisualStudio.Workload.VCTools', '--includeRecommended' -Wait -PassThru
          # 3010: installed, a restart is suggested. Not needed for building.
          if ($process.ExitCode -notin 0, 3010) { throw "Build tools install failed: $($process.ExitCode)" }
      # rust-toolchain.toml picks the version. The image's own rustup isn't let update
      # itself: that broke the rustup call after it.
      - name: Toolchain
        run: |
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          if (-not (Test-Path (Join-Path $cargoBin 'rustup.exe'))) {
            $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest 'https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe' -OutFile $init
            & $init -y --profile minimal --default-toolchain none
            if ($LASTEXITCODE -ne 0) { throw 'rustup install failed' }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin
          & (Join-Path $cargoBin 'rustup.exe') set auto-self-update disable
          # cargo installs rust-toolchain.toml's version the first time it runs.
          & (Join-Path $cargoBin 'cargo.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'rustup toolchain install failed' }
      # The chat's tests lay out text in the first faces its font lists name: Inter (the
      # repo's) and Cascadia Code (OFL, Microsoft's). The runner may lack them.
      - name: Fonts
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'cascadia.zip'
          Invoke-WebRequest 'https://github.com/microsoft/cascadia-code/releases/download/v2407.24/CascadiaCode-2407.24.zip' -OutFile $zip
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'cascadia') -Force
          $files = @(Get-ChildItem app\assets\Inter-*.ttf) + @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'cascadia\ttf\static\CascadiaCode-*.ttf'))
          if ($files.Count -lt 5) { throw "Expected the Inter and Cascadia Code files, found $($files.Count)" }
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
          foreach ($f in $files) {
            Copy-Item $f.FullName (Join-Path $env:windir 'Fonts') -Force
            New-ItemProperty -Path $key -Name "$($f.BaseName) (TrueType)" -Value $f.Name -PropertyType String -Force | Out-Null
          }
      # Saved only from main (a pull request restores main's), so PRs don't push it out
      # of the repo's cache space; without it the job builds ~350 crates from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The ci profile (Cargo.toml): release's optimisation, built about a third faster.
      - name: Test
        run: |
          cargo test --profile ci --workspace --no-fail-fast
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
      - name: Build installer
        if: env.RELEASE == 'true'
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
            $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }
          }
          .\build.ps1 installer -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: installer-windows
          path: dist/Hover-Setup-${{ env.RELEASE_VERSION }}.exe
          if-no-files-found: error

  linux:
    # Ubuntu 22.04 (glibc 2.35), so the packages run on 22.04 and newer.
    runs-on: ubuntu-22.04
    outputs:
      release: ${{ steps.rel.outputs.release }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The same choice as the Windows job's.
      - name: Release?
        id: rel
        run: |
          # Cargo.toml has CRLF line endings: the CR isn't part of the version.
          crate=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$crate" ]] || { echo "The tag is $GITHUB_REF_NAME but Cargo.toml says $crate." >&2; exit 1; }
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == main ]]; then
            [[ -z "$(git ls-remote --tags origin "refs/tags/v$crate")" ]] && release=true
          fi
          echo "version $crate, release: $release"
          { echo "RELEASE=$release"; echo "RELEASE_VERSION=$crate"; } >> "$GITHUB_ENV"
          { echo "release=$release"; echo "version=$crate"; } >> "$GITHUB_OUTPUT"
      - name: System libraries
        run: |
          SUDO=; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          $SUDO apt-get update
          # Build: fontconfig, FreeType, ALSA, xkbcommon. Tests: DejaVu (the chat goldens),
          # dbus, GNOME Keyring and Python's GLib (the D-Bus tests skip without them).
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig1-dev libfreetype-dev libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev fonts-dejavu-core \
            dbus gnome-keyring python3-gi mesa-vulkan-drivers
      - name: Toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # cargo installs rust-toolchain.toml's version the first time it runs.
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
        run: |
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          cargo test --profile ci --workspace --no-fail-fast
      - name: Build packages
        if: env.RELEASE == 'true'
        run: make package VERSION="$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: installer-linux
          path: |
            dist/hover_${{ env.RELEASE_VERSION }}_amd64.deb
            dist/hover-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    # Apple Silicon runner. No tests (the runner has no display, Keychain or permission
    # prompts to run Hover on). The Mac app is the Swift UI in macos/ with the web office
    # (web/office), on the Go backend (go/cmd/hover-backend). Every run checks the Rust
    # crates and makes Hover.app (signed ad hoc); a release also makes it for Intel and
    # puts both in disk images on the release.
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      release: ${{ steps.rel.outputs.release }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The same choice as the Windows job's.
      - name: Release?
        id: rel
        run: |
          crate=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$crate" ]] || { echo "The tag is $GITHUB_REF_NAME but Cargo.toml says $crate." >&2; exit 1; }
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == main ]]; then
            [[ -z "$(git ls-remote --tags origin "refs/tags/v$crate")" ]] && release=true
          fi
          echo "version $crate, release: $release"
          { echo "RELEASE=$release"; echo "RELEASE_VERSION=$crate"; } >> "$GITHUB_ENV"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      # Voice uses macOS 26's SpeechAnalyzer, which needs the macOS 26 SDK: the newest
      # Xcode 26 on the image (its default is older). Without one the build goes on, and
      # Voice.swift compiles only the older recognizer (#if compiler(>=6.2)).
      - name: Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x/Contents/Developer"; fi
          xcodebuild -version
      - name: Toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # cargo installs rust-toolchain.toml's version the first time it runs.
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/office/package-lock.json
      # Every crate that targets macOS: not the Slint app (`hover`, Windows and Linux
      # only) nor notch-proto (a Windows prototype) and hover-measure (its Windows and
      # Linux scenarios). --locked: a change that needs a new Cargo.lock fails here
      # instead of being made.
      - name: Check
        run: cargo check --workspace --exclude hover --exclude notch-proto --exclude hover-measure --all-targets --locked
      # The backend is Go, built by build-macos.sh; go/go.mod names the version.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # npm ci and the office page, the Swift app, the Go backend, the guardian,
      # Info.plist (the version from Cargo.toml) and an ad hoc signature.
      - name: Hover.app
        run: |
          ./scripts/build-macos.sh
          ditto -c -k --keepParent dist/macos-osx-arm64/Hover.app dist/Hover-osx-arm64-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hover-macOS-development
          path: dist/Hover-osx-arm64-development.zip
          retention-days: 7
          if-no-files-found: error
      # A release (or a run started by hand, to try the packaging) builds Intel too: Go and
      # Swift cross-compile on the Apple Silicon runner.
      - name: Hover.app (Intel)
        if: env.RELEASE == 'true' || github.event_name == 'workflow_dispatch'
        env:
          HOVER_ARCH: x64
        run: ./scripts/build-macos.sh
      # A disk image per arch: Hover.app beside a link to /Applications, to drag across.
      # hdiutil on the runners is sometimes "busy" for a moment, so it is tried again.
      - name: Disk images
        if: env.RELEASE == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          for rid in arm64 x64; do
            stage=$(mktemp -d)
            ditto "dist/macos-osx-$rid/Hover.app" "$stage/Hover.app"
            ln -s /Applications "$stage/Applications"
            out="dist/Hover-$RELEASE_VERSION-macos-$rid.dmg"
            for try in 1 2 3 4 5; do
              hdiutil create -volname Hover -srcfolder "$stage" -ov -format UDZO "$out" && break
              [[ $try == 5 ]] && exit 1; sleep 5
            done
            hdiutil verify "$out"
          done
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: installer-macos
          path: |
            dist/Hover-${{ env.RELEASE_VERSION }}-macos-arm64.dmg
            dist/Hover-${{ env.RELEASE_VERSION }}-macos-x64.dmg
          if-no-files-found: error
  release:
    # One job publishes, so the builds never race to create the release.
    if: needs.windows.outputs.release == 'true' && needs.linux.outputs.release == 'true' && needs.macos.outputs.release == 'true'
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      # The release text is this version's section of CHANGELOG.md, so the page on GitHub
      # says what the changelog says. A version with no section stops the release here.
      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          {
            echo "**macOS:** download \`Hover-$VERSION-macos-arm64.dmg\` (Apple silicon) or \`-macos-x64.dmg\` (Intel), open it and drag Hover to Applications. The app isn't notarized yet, so the first time, open it with right-click → Open (or System Settings → Privacy & Security → Open Anyway)."
            echo
            tr -d '\r' < CHANGELOG.md | awk -v v="$VERSION" 'on && /^## \[/ { exit } index($0, "## [" v "]") == 1 { on = 1; next } on { print }'
          } > release-notes.md
          if ! grep -q '^### ' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION. Add '## [$VERSION] - date' with its changes, then run the release again."
            exit 1
          fi
          cat release-notes.md
          # A nightly build: the version's heading ends in "(nightly)" (## [5.0.1] - date (nightly)).
          if tr -d '\r' < CHANGELOG.md | grep -F "## [$VERSION]" | head -n1 | grep -q '(nightly)$'; then
            echo "nightly=true" >> "$GITHUB_OUTPUT"
          else
            echo "nightly=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # The tag is made here when a push released (on a tag push it is that tag).
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Hover v${{ needs.windows.outputs.version }}${{ steps.notes.outputs.nightly == 'true' && ' (nightly)' || '' }}
          # The Rust port is main now, so each release is the Latest one, unless it is a nightly:
          # that is a pre-release and leaves the Latest where it was.
          prerelease: ${{ steps.notes.outputs.nightly == 'true' }}
          make_latest: ${{ steps.notes.outputs.nightly == 'true' && 'false' || 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: release-notes.md
