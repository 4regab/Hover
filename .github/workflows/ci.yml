name: ci
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]   # diag: repeat the E2E to catch an intermittent stall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build .\Hover.slnx -c Release
      - name: Unit tests
        run: dotnet test .\Hover.slnx -c Release --no-build
      - name: Larger screen for the end-to-end run
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: End-to-end
        env:
          HOVER_EXE: ${{ github.workspace }}\src\Hover\bin\Release\net8.0-windows\Hover.exe
          HOVER_E2E_OUT: ${{ github.workspace }}\e2e-shots
        run: dotnet test .\tests\Hover.E2E\Hover.E2E.csproj -c Release --logger "console;verbosity=detailed"
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-${{ matrix.attempt }}
          path: e2e-shots
          if-no-files-found: ignore
