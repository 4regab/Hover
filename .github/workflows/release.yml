name: Release

# A v* tag (three numbers, e.g. v3.1.0) builds the native (Rust) Hover's installers on
# GitHub's own Windows and Linux runners and publishes them together as a pre-release.
# The tests are ci.yml's, on every push of the commit the tag points at; a tag on a
# commit whose CI failed shouldn't be pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw 'Release tag must be v followed by three numeric version parts, for example v3.1.0.'
          }
          $crate = (Select-String -Path native\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($crate -ne $Matches.version) { throw "The tag is $env:GITHUB_REF_NAME but native/Cargo.toml says $crate." }
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$($Matches.version)"

      # rust-toolchain.toml picks the version; rustup and MSVC are on the runner.
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # build.ps1 finds Inno Setup 6 or 7; only installed when the image lacks it.
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build installer
        run: .\build.ps1 installer -Version $env:RELEASE_VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Hover-Setup-${{ env.RELEASE_VERSION }}.exe
          if-no-files-found: error

  linux:
    # Ubuntu 22.04 (glibc 2.35), so the build runs on 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo 'Release tag must be v followed by three numeric version parts, for example v3.1.0.' >&2; exit 1; }
          echo "RELEASE_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: System libraries
        run: |
          sudo apt-get update
          # fontconfig and FreeType (fonts), ALSA (music), xkbcommon (keyboard).
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig1-dev libfreetype-dev libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build packages
        run: make package VERSION="$RELEASE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/hover_${{ env.RELEASE_VERSION }}_amd64.deb
            dist/hover-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    # One job publishes, so the two builds never race to create the release.
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Hover ${{ github.ref_name }} (native, pre-release)
          # A pre-release is never "Latest": 2.x downloads stay where they are.
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
