name: Go port

# The Go port (docs/development/go-port.md), on its own branch; ci.yml is untouched.
# Linux vets and tests the Go code and builds it for Windows. Windows runs phase 0's
# notch spike self-test, then the Rust prototype's (tools/notch-proto) on the same
# runner, and compares the two reports check by check, with their private commit.
on:
  push:
    branches: ['go-port']
    paths: ['go/**', '.github/workflows/go-port.yml', 'packaging/windows/**', 'crates/hover-core/**', 'crates/hover-notch/**', 'crates/hover-office/**', 'tools/notch-proto/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A manual run (the Rust shots take a while) is not cancelled by the next push.
  group: go-port-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # The Linux app draws through Gio's EGL (a C compiler and the EGL headers); its window
      # is Wayland, spoken directly, so Gio's own Wayland, X11 and Vulkan are left out.
      - run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet -tags nowayland,nox11,novulkan ./...
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./...
      - run: go test -race -tags nowayland,nox11,novulkan ./...
      - run: go build -tags nowayland,nox11,novulkan -o ../hover-linux ./cmd/hover
      # The Mac backend compiles for both Macs (it is run by backend-diff).
      - run: GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/hover-backend && GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/hover-backend
      # The Linux packages (compiled, not run: no Wayland desktop on the runner).
      - name: Linux packages
        working-directory: .
        run: |
          curl -sL -o wgpu.zip https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.0.0/wgpu-linux-x86_64-release.zip
          unzip -o -q wgpu.zip lib/libwgpu_native.so
          WGPU_NATIVE_LIB=lib/libwgpu_native.so sh packaging/linux/package-linux-go.sh "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1 | tr -d '\r')" dist
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-go
          path: dist/
          if-no-files-found: error
      # No C compiler: the Windows build works from any machine.
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/notch-spike.exe ./cmd/notch-spike

  spike-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # On Windows itself: DPAPI, the registry, the named mutex and CRLF settings.json.
      - name: Go tests
        working-directory: go
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }
      - name: Build the Go spike
        working-directory: go
        run: |
          $env:CGO_ENABLED = '0'
          go build -o ..\spike\notch-spike.exe .\cmd\notch-spike
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
      # Phase 1's data check on Windows: the Rust hover-data and the Go one each write a
      # data folder (DPAPI key, settings.json, a sealed session), and each reads the
      # other's. `check` then says whether Go would save every file with the same bytes.
      - name: Rust and Go read each other's data folders
        run: |
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          & (Join-Path $cargoBin 'rustup.exe') set auto-self-update disable
          & (Join-Path $cargoBin 'cargo.exe') build --release -p hover-core --bin hover-data
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          Push-Location go
          go build -o ..\spike\hover-data-go.exe .\cmd\hover-data
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          Pop-Location
          $rust = 'target\release\hover-data.exe'; $go = 'spike\hover-data-go.exe'
          $d = Join-Path $env:RUNNER_TEMP 'data'
          New-Item -ItemType Directory -Force $d | Out-Null
          Set-Content -Path "$d\answer.md" -Value "# Answer`n`nRich <text> & `"quotes`", é, 日本, 👋.`n`n| a | b |`n|---|---|`n| 1 | 2 |" -Encoding utf8
          & $rust write "$d\rust" "$d\proj" 3 "$d\answer.md"; if ($LASTEXITCODE) { throw 'rust write' }
          & $go write "$d\go" "$d\proj" 3 "$d\answer.md"; if ($LASTEXITCODE) { throw 'go write' }
          $out = @()
          foreach ($pair in @(@($rust, 'go'), @($go, 'rust'), @($rust, 'rust'), @($go, 'go'))) {
            $text = (& $pair[0] dump "$d\$($pair[1])" 2>$null) -join "`n"
            if ($text -notmatch 'history: 1 sessions' -or $text -notmatch '3 turns') { throw "$($pair[0]) couldn't read $($pair[1])'s folder:`n$text" }
            $out += "$($pair[0]) reads $($pair[1])'s folder: ok"
          }
          $a = [IO.File]::ReadAllBytes("$d\rust\settings.json"); $b = [IO.File]::ReadAllBytes("$d\go\settings.json")
          if ([Convert]::ToBase64String($a) -ne [Convert]::ToBase64String($b)) { throw 'settings.json: Rust and Go wrote different bytes' }
          $out += "settings.json: Rust and Go wrote the same $($a.Length) bytes"
          foreach ($f in 'rust', 'go') {
            & $go check "$d\$f" 2>$null | ForEach-Object { $out += "  $f $_" }
            if ($LASTEXITCODE) { throw "Go would save $f's files differently" }
          }
          $out | ForEach-Object { Write-Host $_ }
          @('', '### Phase 1: data folders on Windows', '') + ($out | ForEach-Object { "    $_" }) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      # The version internal/gpu's structs are checked against (wire_test.go).
      - name: wgpu-native
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wgpu.zip'
          Invoke-WebRequest 'https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.0.0/wgpu-windows-x86_64-msvc-release.zip' -OutFile $zip
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'wgpu') -Force
          $dll = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'wgpu') -Recurse -Filter wgpu_native.dll | Select-Object -First 1
          if (-not $dll) { throw 'no wgpu_native.dll in the release zip' }
          Copy-Item $dll.FullName spike\
          Write-Host "wgpu_native.dll: $([math]::Round($dll.Length / 1MB, 1)) MB"
      # Hover's own wgpu-native binding drawing on the runner's CPU adapter (WARP, DX12).
      - name: Go GPU tests on WARP
        working-directory: go
        run: |
          $env:WGPU_NATIVE_PATH = (Resolve-Path ..\spike\wgpu_native.dll).Path
          go test ./internal/gpu -run Live -v -count=1
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }
      # The office rendered on WARP, as the Rust office's shot example renders it (the Rust
      # shots come after notch-proto's build, and both go in the artifact to compare).
      - name: Go office shots on WARP
        working-directory: go
        run: |
          $env:WGPU_NATIVE_PATH = (Resolve-Path ..\spike\wgpu_native.dll).Path
          New-Item -ItemType Directory -Force ..\out\office | Out-Null
          foreach ($t in 'night', 'day') {
            go run ./cmd/office-shot "..\out\office\go-$t.png" $t
            if ($LASTEXITCODE -ne 0) { throw "office-shot $t failed" }
          }
      # The Go UI rendered headless (Direct3D 11 on WARP), under the names the Rust app's
      # hover --shots gives its own (the rust-shots job, run by hand), to compare.
      - name: Go UI shots
        working-directory: go
        run: |
          $env:CGO_ENABLED = '0'
          go run ./cmd/ui-shots ..\out\ui
          if ($LASTEXITCODE -ne 0) { throw 'ui-shots failed' }
          Write-Host "$((Get-ChildItem ..\out\ui -Filter *.png).Count) shots"
      # The runner's screen is 1024 x 768: the open notch's window (1080 wide) runs off it,
      # and the self-tests' corner pixels read black. Best effort; both tests share it.
      - name: Screen 1920 x 1080
        run: |
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class Res {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern bool EnumDisplaySettings(string d, int m, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int ChangeDisplaySettings(ref DEVMODE dm, int f);
            public static int Set(int w, int h) {
              var dm = new DEVMODE(); dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
              if (!EnumDisplaySettings(null, -1, ref dm)) return -100;
              dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmFields = 0x80000 | 0x100000;
              return ChangeDisplaySettings(ref dm, 0);
            }
          }
          '@
          $r = [Res]::Set(1920, 1080)
          Write-Host "ChangeDisplaySettings returned $r (0 means done)"
      # Each self-test gets 90 s and its leftovers are killed: run 2's Rust test crashed
      # and its helper window kept the step's output pipe open for 23 minutes.
      - name: Go spike self-test
        timeout-minutes: 3
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $p = Start-Process spike\notch-spike.exe -ArgumentList '--selftest', 'out\go', '--wgsl', 'crates\hover-office\src' -PassThru -NoNewWindow -RedirectStandardError out\go-stderr.log
          $null = $p.Handle  # without it ExitCode reads empty
          if (-not $p.WaitForExit(90000)) { Write-Host 'timed out'; $p.Kill() }
          Write-Host "exit code $($p.ExitCode)"
          Get-Process notch-spike -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content out\go-stderr.log
          exit 0
      # The Rust baseline on the same machine. The image has MSVC and rustup;
      # rust-toolchain.toml picks the version, as in ci.yml.
      - name: Build notch-proto
        run: |
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin
          & (Join-Path $cargoBin 'rustup.exe') set auto-self-update disable
          & (Join-Path $cargoBin 'cargo.exe') build --release -p notch-proto
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
      - name: Rust prototype self-test
        timeout-minutes: 3
        run: |
          # The runner has no GPU; Slint refuses wgpu's CPU adapter (WARP) unless told.
          $env:SLINT_WGPU_CPU = '1'
          $p = Start-Process target\release\notch-proto.exe -ArgumentList '--selftest', 'out\rust' -PassThru -NoNewWindow -RedirectStandardError out\rust-stderr.log
          $null = $p.Handle
          if (-not $p.WaitForExit(90000)) { Write-Host 'timed out'; $p.Kill() }
          Write-Host "exit code $($p.ExitCode)"
          Get-Process notch-proto -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content out\rust-stderr.log
          exit 0
      # The reference for the Go shots, not a check of the port: a failure here leaves the
      # artifact without them.
      - name: Rust office shots on WARP
        continue-on-error: true
        run: |
          cargo build --release -p hover-office --example shot
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          foreach ($t in 'night', 'day') {
            & target\release\examples\shot.exe "out\office\rust-$t.png" $t
            if ($LASTEXITCODE -ne 0) { throw "shot $t failed" }
          }
      - name: Compare
        run: |
          function Read-Report($dir) {
            $p = Join-Path $dir 'report.json'
            if (Test-Path $p) { Get-Content $p -Raw | ConvertFrom-Json } else { $null }
          }
          $go = Read-Report 'out\go'
          $rust = Read-Report 'out\rust'
          if (-not $go) { throw 'the Go spike wrote no report' }
          $names = @($go.PSObject.Properties | Where-Object { $_.Value.PSObject.Properties.Name -contains 'pass' } | ForEach-Object Name)
          if ($rust) { $names += @($rust.PSObject.Properties | Where-Object { $_.Value.PSObject.Properties.Name -contains 'pass' } | ForEach-Object Name) }
          $word = { param($r, $n) if (-not $r -or -not $r.$n) { '-' } elseif ($r.$n.pass) { 'pass' } else { 'FAIL' } }
          $lines = @('| Check | Rust (notch-proto) | Go (notch-spike) |', '|---|---|---|')
          $worse = @()
          foreach ($n in ($names | Sort-Object -Unique)) {
            $r = & $word $rust $n; $g = & $word $go $n
            $lines += "| $n | $r | $g |"
            if ($g -eq 'FAIL' -and $r -ne 'FAIL') { $worse += $n }
          }
          $mib = { param($r) if ($r -and $r.no_redraws_while_resting) { '{0:N1} MiB' -f ($r.no_redraws_while_resting.detail.private_bytes / 1MB) } else { '-' } }
          $lines += ''
          $lines += "Private commit at rest, after the run: Rust $(& $mib $rust), Go $(& $mib $go)."
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $lines | ForEach-Object { Write-Host $_ }
          if ($worse.Count) { throw "The Go spike fails where the Rust prototype doesn't: $($worse -join ', ')" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-reports
          path: out/
          if-no-files-found: warn

  # The Go app itself (cmd/hover) on a runner: built with no C compiler, started, and
  # driven the way a user would: the shortcut, Esc, a second launch.
  app-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build hoverai.exe
        working-directory: go
        run: |
          $env:CGO_ENABLED = '0'
          New-Item -ItemType Directory -Force ..\out | Out-Null
          go build -ldflags '-H=windowsgui' -o ..\out\hoverai.exe .\cmd\hover
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          Write-Host "hoverai.exe: $([math]::Round((Get-Item ..\out\hoverai.exe).Length / 1MB, 1)) MB"
      # The office draws with wgpu-native; the exe looks for the DLL beside itself.
      - name: wgpu-native beside the exe
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wgpu.zip'
          Invoke-WebRequest 'https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.0.0/wgpu-windows-x86_64-msvc-release.zip' -OutFile $zip
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'wgpu') -Force
          $dll = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'wgpu') -Recurse -Filter wgpu_native.dll | Select-Object -First 1
          if (-not $dll) { throw 'no wgpu_native.dll in the release zip' }
          Copy-Item $dll.FullName out\
      - name: Screen 1920 x 1080
        run: ./go/tools/set-resolution.ps1
      - name: Drive the app
        timeout-minutes: 5
        run: ./go/tools/app-smoke.ps1 -Exe out\hoverai.exe -Out out\app
      - name: Summary
        if: always()
        run: |
          if (Test-Path out\app\report.json) {
            $r = Get-Content out\app\report.json -Raw | ConvertFrom-Json
            @('', '### Go app on Windows', '') + ($r.PSObject.Properties | Where-Object Name -ne 'log' | ForEach-Object { "    $($_.Name) = $($_.Value)" }) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-windows
          path: out/app/
          if-no-files-found: warn

  # The Rust app's own renders of every view (hover --shots, Slint's software renderer):
  # what the Go UI is ported against. Run by hand only (workflow_dispatch), as the Rust
  # app doesn't change on this branch.
  rust-shots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Build hoverai
        run: |
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          & (Join-Path $cargoBin 'rustup.exe') set auto-self-update disable
          & (Join-Path $cargoBin 'cargo.exe') build --release -p hover --bin hoverai
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
      # hoverai is a GUI program: Start-Process -Wait is what waits for it.
      - name: Render every view
        timeout-minutes: 20
        run: |
          New-Item -ItemType Directory -Force out\rust-shots | Out-Null
          $p = Start-Process target\release\hoverai.exe -ArgumentList '--shots', 'out\rust-shots' -PassThru -Wait -NoNewWindow -RedirectStandardError out\rust-shots-stderr.log
          Write-Host "exit code $($p.ExitCode)"
          Get-Content out\rust-shots-stderr.log -Tail 40
          Write-Host "$((Get-ChildItem out\rust-shots -Filter *.png).Count) shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-shots
          path: out/
          if-no-files-found: warn

  # The installer: the Go build's setup installed over the Rust 5.x release the way a user
  # would, then removed (go/tools/installer-check.ps1). The setup is kept as an artifact.
  installer-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build hoverai.exe with the version
        working-directory: go
        run: |
          $env:CGO_ENABLED = '0'
          $v = (Select-String -Path ..\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$v"
          New-Item -ItemType Directory -Force ..\publish | Out-Null
          go build -ldflags "-H=windowsgui -X github.com/4regab/Hover/go/internal/shell.Version=$v" -o ..\publish\hoverai.exe .\cmd\hover
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
      - name: wgpu-native beside the exe
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wgpu.zip'
          Invoke-WebRequest 'https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.0.0/wgpu-windows-x86_64-msvc-release.zip' -OutFile $zip
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'wgpu') -Force
          $dll = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'wgpu') -Recurse -Filter wgpu_native.dll | Select-Object -First 1
          if (-not $dll) { throw 'no wgpu_native.dll in the release zip' }
          Copy-Item $dll.FullName publish\
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
            $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }
          }
      - name: Build the setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:VERSION" "/DExeDir=$((Resolve-Path publish).Path)" "/O$((Resolve-Path .).Path)\dist" packaging\windows\Hover.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          Write-Host "$((Get-Item "dist\Hover-Setup-${env:VERSION}.exe").Length / 1MB) MB"
      # The latest 5.x release the Rust app shipped: what an update installs over.
      - name: The 5.x setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force old | Out-Null
          gh release download v5.0.2 --repo ${{ github.repository }} --pattern 'Hover-Setup-5.0.2.exe' --dir old
          if ($LASTEXITCODE -ne 0) { throw 'no 5.0.2 setup to install over' }
      - name: Install over 5.x, check, uninstall
        timeout-minutes: 10
        run: ./go/tools/installer-check.ps1 -Setup "dist\Hover-Setup-$env:VERSION.exe" -Old old\Hover-Setup-5.0.2.exe -Built publish\hoverai.exe -Out out\installer
      - name: Summary
        if: always()
        run: |
          if (Test-Path out\installer\report.json) {
            $r = Get-Content out\installer\report.json -Raw | ConvertFrom-Json
            @('', '### Go installer on Windows', '') + ($r.PSObject.Properties | ForEach-Object { "    $($_.Name) = $($_.Value)" }) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-windows-go
          path: |
            dist/
            out/installer/
          if-no-files-found: warn

  # The memory rule (the Go notch at rest within 25% of the Rust app's): both apps started
  # on the same runner and read at rest by the same script. Run by hand only, as it builds
  # the Rust app.
  memory-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build both
        run: |
          $env:CGO_ENABLED = '0'
          New-Item -ItemType Directory -Force out | Out-Null
          Push-Location go
          go build -ldflags '-H=windowsgui' -o ..\out\hoverai-go.exe .\cmd\hover
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          Pop-Location
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          & (Join-Path $cargoBin 'rustup.exe') set auto-self-update disable
          & (Join-Path $cargoBin 'cargo.exe') build --release -p hover --bin hoverai
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          Copy-Item target\release\hoverai.exe out\hoverai-rust.exe
      - name: wgpu-native beside the Go exe
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wgpu.zip'
          Invoke-WebRequest 'https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.0.0/wgpu-windows-x86_64-msvc-release.zip' -OutFile $zip
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'wgpu') -Force
          Copy-Item (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'wgpu') -Recurse -Filter wgpu_native.dll | Select-Object -First 1).FullName out\
      - name: Screen 1920 x 1080
        run: ./go/tools/set-resolution.ps1
      - name: Go at rest
        timeout-minutes: 5
        run: ./go/tools/app-smoke.ps1 -Exe out\hoverai-go.exe -Out out\go
      - name: Rust at rest
        timeout-minutes: 5
        continue-on-error: true
        env:
          # The runner has no GPU; Slint refuses wgpu's CPU adapter (WARP) unless told.
          SLINT_WGPU_CPU: '1'
        run: ./go/tools/app-smoke.ps1 -Exe out\hoverai-rust.exe -Out out\rust
      - name: Compare
        if: always()
        run: |
          $g = Get-Content out\go\report.json -Raw | ConvertFrom-Json
          $r = if (Test-Path out\rust\report.json) { Get-Content out\rust\report.json -Raw | ConvertFrom-Json } else { $null }
          $lines = @('', '### Memory at rest (private MB)', '', "    Go:   $($g.rest_private_mb)  (working set $($g.rest_working_set_mb))")
          if ($r) {
            $lines += "    Rust: $($r.rest_private_mb)  (working set $($r.rest_working_set_mb))"
            $lines += "    Go / Rust = $([math]::Round($g.rest_private_mb / $r.rest_private_mb, 2)) (the rule: at most 1.25)"
          } else { $lines += '    Rust: no reading' }
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $lines | ForEach-Object { Write-Host $_ }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-windows
          path: out/
          if-no-files-found: warn

  # Phase 7: the Mac app's backend in Go (cmd/hover-backend) against the Rust one. Both are
  # started with the same scripted sessions (the protocol tests of crates/hover-backend, with
  # the stand-in tools and gh), and every message they send is compared. On Linux, and on a
  # Mac.
  backend-diff:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-14' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build the Rust backend and its stand-ins
        run: |
          cargo build --release -p hover-backend
          cargo build --release -p hover-measure --bin fake-agent --bin fake-opencode
          rustc --edition 2021 -C debuginfo=0 crates/hover-agents/tests/fixtures/fakegh.rs -o "$RUNNER_TEMP/fakegh"
      - name: Build the Go backend
        working-directory: go
        run: go build -o "$RUNNER_TEMP/hb-go" ./cmd/hover-backend
      - name: Same sessions, both backends
        timeout-minutes: 25
        env:
          HB_GO: ${{ runner.temp }}/hb-go
          FAKE_GH: ${{ runner.temp }}/fakegh
        run: python3 go/tools/backend-diff/run.py

  # The Mac's platform layer (core/macos.go, platform_darwin.go, keychain_darwin.go) on a
  # Mac, next to the Rust build's: the data folder, and note.key in the login Keychain.
  # The runner's own keychain can be locked, so the job makes one and unlocks it. A Keychain
  # item asks the user before another program reads it (the Rust and the Go builds are two
  # programs), and a runner can't answer, so the cross-read uses an item made for any app.
  core-macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: A keychain this job may write to
        run: |
          security create-keychain -p hover ci.keychain
          security set-keychain-settings -lut 21600 ci.keychain
          security unlock-keychain -p hover ci.keychain
          security list-keychains -d user -s "$HOME/Library/Keychains/ci.keychain-db"
          security default-keychain -d user -s "$HOME/Library/Keychains/ci.keychain-db"
          security default-keychain -d user
      - name: Build hover-data in Rust and in Go
        run: |
          cargo build --release -p hover-core --bin hover-data
          (cd go && go build -o "$RUNNER_TEMP/hover-data-go" ./cmd/hover-data)
      - name: Data folder, Keychain, and each build reading the other's
        run: |
          set -eu
          RUST="$PWD/target/release/hover-data"; GO="$RUNNER_TEMP/hover-data-go"
          D="$RUNNER_TEMP/data"; mkdir -p "$D"
          printf '# Answer\n\nRich <text> & "quotes", é, 日本.\n' > "$D/answer.md"
          OUT="$RUNNER_TEMP/core-macos.txt"; : > "$OUT"
          say() { echo "$*" | tee -a "$OUT"; }
          fail() { say "FAILED: $*"; exit 1; }
          # A Keychain prompt would wait for a person; a minute is long enough for the program.
          tool() { perl -e 'alarm 60; exec @ARGV' -- "$@"; }

          # Where the data goes: ~/Library/Application Support/Hover, in both builds.
          H="$RUNNER_TEMP/home"; mkdir -p "$H"
          want="$H/Library/Application Support/Hover"
          for who in rust go; do
            bin="$RUST"; [ "$who" = go ] && bin="$GO"
            got=$(env -u HOVER_DATA_DIR HOME="$H" "$bin" where)
            [ "$got" = "$want" ] || fail "$who puts its data in '$got', not '$want'"
          done
          say "data folder: both builds use ~/Library/Application Support/Hover"

          # Each build keeps its own key in the Keychain and reads it back. A note.key that
          # holds the key itself would mean the Keychain was not used.
          for who in rust go; do
            bin="$RUST"; [ "$who" = go ] && bin="$GO"
            tool "$bin" write "$D/$who" "$D/proj" 3 "$D/answer.md" > /dev/null
            grep -q '^hover-key:keychain:' "$D/$who/note.key" || fail "$who: note.key does not name a Keychain item"
            id=$(sed -n 's/^hover-key:keychain:\(.*\)$/\1/p' "$D/$who/note.key")
            security find-generic-password -s Hover -a "note.key:$id" > /dev/null || fail "$who: no Keychain item Hover / note.key:$id"
            tool "$bin" dump "$D/$who" | grep -q 'history: 1 sessions' || fail "$who couldn't read its own history"
            say "$who: key kept in the Keychain (Hover / note.key:$id), history read back"
          done

          # Each reading what the other wrote, with a key both can reach (made for any app,
          # 32 characters so it is a 32-byte key).
          seed=5eed5eed5eed5eed
          security add-generic-password -A -s Hover -a "note.key:$seed" -w abcdefghijklmnopqrstuvwxyz012345
          security set-generic-password-partition-list -S "apple-tool:,apple:,unsigned:" -s Hover -a "note.key:$seed" -k hover > /dev/null 2>&1 || true
          for who in rust go; do
            mkdir -p "$D/x-$who"; printf 'hover-key:keychain:%s\n' "$seed" > "$D/x-$who/note.key"
          done
          tool "$RUST" write "$D/x-rust" "$D/proj" 3 "$D/answer.md" > /dev/null
          tool "$GO" write "$D/x-go" "$D/proj" 3 "$D/answer.md" > /dev/null
          for pair in "rust go" "go rust" "rust rust" "go go"; do
            set -- $pair; bin="$RUST"; [ "$1" = go ] && bin="$GO"
            tool "$bin" dump "$D/x-$2" 2>&1 | grep -q 'history: 1 sessions' || fail "$1 couldn't read what $2 wrote through the Keychain"
            say "$1 reads what $2 wrote, key from the Keychain: ok"
          done
          cmp "$D/x-rust/settings.json" "$D/x-go/settings.json" || fail "settings.json: Rust and Go wrote different bytes"
          say "settings.json: the same bytes"
          { echo; echo '### The Mac: data folder and Keychain'; echo; sed 's/^/    /' "$OUT"; } >> "$GITHUB_STEP_SUMMARY"
