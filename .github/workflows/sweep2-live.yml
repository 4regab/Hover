# TEMPORARY: runs the sweep 2 live checks of the app on the runner without the rest of ci.yml, so that a failure can be
# read and fixed quickly. Started by a push of its settings file (a workflow can only be started by hand when its file is on
# the default branch, which this work must not touch). Deleted in the last commit of the item that made it.
name: Sweep 2 live

on:
  push:
    branches: [windows-csharp]
    paths: ['.github/sweep2-live.cfg']

# Its own group: it never cancels or waits for ci.yml.
concurrency:
  group: sweep2-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Settings from .github/sweep2-live.cfg
        run: |
          $cfg = @{ project = 'Hover.Tests'; test = 'Sweep2AppTests'; runs = '1'; scale = '' }
          foreach ($line in Get-Content .github/sweep2-live.cfg) {
            if ($line -match '^\s*(project|test|runs|scale)\s*=\s*(\S+)\s*$') { $cfg[$Matches[1]] = $Matches[2] }
          }
          $cfg.GetEnumerator() | ForEach-Object { "LIVE_$($_.Key.ToUpper())=$($_.Value)" } | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $cfg.GetEnumerator() | ForEach-Object { "$($_.Key) = $($_.Value)" }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the app and the Go programs
        run: |
          ./build.ps1 publish
          New-Item -ItemType Directory -Force out\bin | Out-Null
          $env:CGO_ENABLED = '0'
          go build -o out\bin\hover-backend.exe ./cmd/hover-backend
          go build -o out\bin\hover-data.exe ./cmd/hover-data
      - name: Build the tests
        run: dotnet build windows\$env:LIVE_PROJECT\$env:LIVE_PROJECT.csproj -c Release --nologo -v minimal
      - name: Display scale
        run: |
          ./tools/set-resolution.ps1
          "before: " + (./tools/set-scale.ps1)
          if ($env:LIVE_SCALE) {
            "asking: " + (./tools/set-scale.ps1 -Percent ([int]$env:LIVE_SCALE))
            Start-Sleep -Seconds 5
            "after: " + (./tools/set-scale.ps1)
          }
        continue-on-error: true
      - name: Run the live checks
        run: |
          $env:HOVER_APP_EXE = (Resolve-Path publish\hoverai.exe).Path
          $env:HOVER_BACKEND = (Resolve-Path out\bin\hover-backend.exe).Path
          $env:HOVER_DATA_TOOL = (Resolve-Path out\bin\hover-data.exe).Path
          New-Item -ItemType Directory -Force out\live | Out-Null
          $failed = 0
          for ($i = 1; $i -le [int]$env:LIVE_RUNS; $i++) {
            "=== run $i ===" | Tee-Object -FilePath out\live\console.txt -Append
            dotnet test windows\$env:LIVE_PROJECT\$env:LIVE_PROJECT.csproj -c Release --no-build --filter "FullyQualifiedName~$env:LIVE_TEST" `
              --logger "trx;LogFileName=live-$i.trx" --logger "console;verbosity=detailed" --results-directory out\live 2>&1 | Tee-Object -FilePath out\live\console.txt -Append
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          "runs $env:LIVE_RUNS, failed $failed"
          if ($failed -gt 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep2-live
          path: out/live/
          if-no-files-found: warn
