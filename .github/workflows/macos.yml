name: macOS
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'macos/**', 'web/office/**', 'scripts/**', 'tests/**', '.github/workflows/macos.yml']
  push:
    branches: [main]
    paths: ['src/**', 'macos/**', 'web/office/**', 'scripts/**', 'tests/**', '.github/workflows/macos.yml']
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sandboxed tests and self-contained Apple Silicon app
        shell: bash
        run: |
          ./scripts/test-macos.sh | tee macos-test.log
          sandbox=$(sed -n 's/^Sandbox: //p' macos-test.log | head -n 1)
          mkdir -p dist/macos-osx-arm64
          ditto "$sandbox/build/Hover.app" dist/macos-osx-arm64/Hover.app
          cp "$sandbox/office-smoke.png" "$sandbox/smoke-result.json" dist/macos-osx-arm64/
          ditto -c -k --keepParent dist/macos-osx-arm64/Hover.app dist/Hover-osx-arm64-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hover-macOS-development
          path: dist/
