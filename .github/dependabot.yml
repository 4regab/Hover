# Weekly pull requests for outdated Go modules and GitHub Actions. Gio (gioui.org) is our own
# patched copy in third_party/, so it is left alone: it moves only on purpose.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gomod:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: gioui.org
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
