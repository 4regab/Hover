name: Feature request
description: Something Hover should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How it could work. Mockups are welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Notch
        - Agent office
        - Chat
        - Voice
        - Projects
        - Settings
        - Quotas
        - Install or update
