[package]
name = "hover-chat"
description = "The office chat thread, native: Markdown blocks laid out as page.html lays them out, with selection, copy, links, images and diagrams."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hover-md = { path = "../hover-md" }
parley = { version = "0.11", default-features = false, features = ["std", "system"] }
swash = "0.2.10"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
parley = { version = "0.11", default-features = false, features = ["std", "system"] }
