[package]
name = "chat-proto"
description = "Phase 1B prototype: the office chat drawer in Slint, with the native rich thread."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hover-chat = { path = "../../crates/hover-chat" }
hover-md = { path = "../../crates/hover-md" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-systemfonts", "accessibility", "unstable-winit-030"] }
serde_json = "1"
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# The web images in answers (WebView2 fetched them for the page), blocking, on worker
# threads. On Windows through schannel and the system's certificate store, as WebView2;
# elsewhere rustls.
[target.'cfg(not(windows))'.dependencies]
ureq = "3"

[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
# The system's double-click time and distance (as notch-proto uses it).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_SystemInformation"] }

[build-dependencies]
slint-build = "=1.18.1"
