[package]
name = "hover-measure"
description = "Dev tools, not shipped: an external memory sampler for Hover's process tree, a scenario runner that drives the release app (its HOVER_BENCH channel and real pointer and keyboard input), a summary of the samples, and fake-agent, a stand-in ACP tool. A crate of its own so the measurements live outside the process they measure."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hover-measure"
path = "src/main.rs"

[[bin]]
name = "fake-agent"
path = "src/fake_agent.rs"

[[bin]]
name = "fake-opencode"
path = "src/fake_opencode.rs"

[dependencies]
# The JSON the fake agent speaks and the runner reads.
hover-core = { path = "../../crates/hover-core" }
# In the tree (hover-office, Slint): screenshots saved as PNG.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Already in the tree: process and memory counters, PDH's GPU counters, SendInput and UI Automation.
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading",
    "Win32_System_Performance", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility",
    "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Memory",
] }
