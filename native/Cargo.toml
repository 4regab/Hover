# The native Hover candidate. Portable crates build and test on Linux; the Windows
# notch layer is behind cfg(windows). See port/README.md.
[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "3.0.0"
edition = "2021"
# 1.89: File::try_lock, for the single instance on Linux.
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
fancy-regex = "0.19"

[profile.release]
# Size and memory over peak throughput: the app idles most of the time.
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"
