<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hover">
  <!--
    The mark is what the app actually is: a small fan of sticky notes, lifted clear
    of its own shadow because the deck only appears when you hover. The three note
    colours are the app's own Mint, Rose and Lemon, and the front note carries the
    saturated edge bar and the ticked task line a real note carries.

    Kept to three big shapes on purpose: at 16 px in the system tray the writing and
    the tick are gone, and a fanned block of yellow, pink and green is all that is
    left to recognise.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="16" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5343BE"/>
      <stop offset="0.55" stop-color="#352B80"/>
      <stop offset="1" stop-color="#1F1948"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="16" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="lift" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#12082A" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#12082A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#12082A" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="tileClip">
      <rect x="16" y="16" width="224" height="224" rx="52"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#gloss)"/>

  <g clip-path="url(#tileClip)">
   <g transform="translate(128 130) scale(1.07) translate(-128 -130)">
    <!-- The shadow the fan floats above. -->
    <ellipse cx="128" cy="200" rx="86" ry="22" fill="url(#lift)"/>

    <!-- The fan hinges low and centre, so the tops splay and the bottoms stay
         together, the way a handful of paper actually opens. -->
    <g transform="rotate(-16 128 208)">
      <rect x="72" y="60" width="112" height="126" rx="14" fill="#B4E8D0"/>
      <rect x="72" y="60" width="112" height="126" rx="14" fill="#1F1948" fill-opacity="0.13"/>
    </g>

    <g transform="rotate(16 128 208)">
      <rect x="72" y="60" width="112" height="126" rx="14" fill="#FAC4D1"/>
      <rect x="72" y="60" width="112" height="126" rx="14" fill="#1F1948" fill-opacity="0.07"/>
    </g>

    <!-- Front note: Lemon, leaning a touch so the stack reads as placed by hand. -->
    <g transform="rotate(-3 128 208)">
      <rect x="70" y="54" width="116" height="132" rx="15" fill="#FCE795"/>
      <!-- The saturated bar every note carries down the edge it hangs from. -->
      <path d="M70 69 A15 15 0 0 1 85 54 L85 186 A15 15 0 0 1 70 171 Z" fill="#E0AD08"/>

      <g stroke="#3A3008" stroke-linecap="round" stroke-width="7.5">
        <line x1="101" y1="86" x2="167" y2="86" stroke-opacity="0.82"/>
        <line x1="101" y1="109" x2="147" y2="109" stroke-opacity="0.4"/>
      </g>

      <!-- A ticked task: the notes hold checklists, not just prose. -->
      <rect x="99" y="134" width="25" height="25" rx="7.5" fill="#3A3008" fill-opacity="0.13"/>
      <path d="M104.5 146.5 L110.5 153 L118.5 140.5" stroke="#3A3008" stroke-opacity="0.88"
            stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="136" y1="146.5" x2="167" y2="146.5" stroke="#3A3008" stroke-opacity="0.4"
            stroke-linecap="round" stroke-width="7.5"/>
    </g>
   </g>
  </g>
</svg>
