# Hover, the native app. The backend crates build and test on any OS; the Windows and
# Linux code is behind cfg(windows) / cfg(not(windows)). See
# docs/development/architecture.md.
[workspace]
resolver = "2"
members = ["app", "crates/*", "tools/*"]
# vendor/femtovg is a dependency through the patch below, not a member.
exclude = ["vendor/femtovg"]

[workspace.package]
version = "3.1.1"
edition = "2021"
# 1.89: File::try_lock, for the single instance on Linux.
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
fancy-regex = "0.19"

[profile.release]
# Size and memory over peak throughput: the app idles most of the time.
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"

[patch.crates-io]
# femtovg 0.27.0 (Slint's renderer on wgpu), with its shader's texture reads behind a
# branch: on WARP (the software D3D12 of GPU-less VMs and RDP hosts) upstream's took every
# core and 3.5 s to open the office. See vendor/femtovg/HOVER.md.
femtovg = { path = "vendor/femtovg" }
