# Hover, the native app. The backend crates build and test on any OS; the Windows, Linux
# and macOS code is behind cfg(windows), cfg(target_os = "linux") and cfg(target_os = "macos").
# See docs/development/architecture.md.
[workspace]
resolver = "2"
members = ["app", "crates/*", "tools/*"]

[workspace.package]
version = "5.0.0"
edition = "2021"
# 1.89: File::try_lock, for the single instance on Linux.
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
fancy-regex = "0.19"

[profile.release]
# Size and memory over peak throughput: the app idles most of the time.
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"

# CI's tests: release's optimisation without what makes it slow to build. No LTO and
# more codegen units (each of the ~30 test binaries was linked with LTO), and unwind,
# since tests always unwind: with release's abort every dependency was built twice,
# once for the binaries the tests start (fake-agent, …) and once for the tests.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
