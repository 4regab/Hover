# The release build of the CI batch. It runs after the Windows and Linux builds pass
# (the graph is in infra/codebuild.yml). The work is in ci/release.sh.
version: 0.2

env:
  shell: bash
  # A GitHub token with contents:write, kept as plain text in Secrets Manager. The name
  # is infra/codebuild.yml's GitHubTokenSecretName: change both together. CodeBuild
  # hides its value in the log.
  secrets-manager:
    GH_TOKEN: hover/github-release-token

phases:
  build:
    commands:
      - bash ci/release.sh
