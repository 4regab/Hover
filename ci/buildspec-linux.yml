# The Linux build of the CI batch (the graph is in infra/codebuild.yml). The work is in
# ci/linux.sh.
version: 0.2

env:
  shell: bash

phases:
  build:
    commands:
      - bash ci/linux.sh

# Kept in the CI bucket: Cargo's downloads (its home has a fixed path, see the script)
# and target/. A key is saved once and never updated, so it names what makes the compiled
# crates go stale: the lock file and the toolchain. A new key starts from an earlier one.
cache:
  key: cargo-linux-$(codebuild-hash-files Cargo.lock rust-toolchain.toml)
  fallback-keys:
    - cargo-linux-
  paths:
    - /root/.cargo/registry/**/*
    - /root/.cargo/git/**/*
    - target/**/*
